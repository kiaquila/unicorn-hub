name: AI Command Policy

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-command-policy:
    name: ai-command-policy
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.comment.body, '@codex') ||
        contains(github.event.comment.body, '/gemini')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted policy scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate trusted actor and record review request
        run: node scripts/ai-command-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_IMPLEMENTATION_AGENT: ${{ vars.AI_IMPLEMENTATION_AGENT }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
