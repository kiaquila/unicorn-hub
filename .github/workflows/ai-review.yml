name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
      trigger_mode:
        description: Review trigger mode
        required: false
        default: skip

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  ai-review:
    name: AI Review
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted gate scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve PR context
        id: pr
        run: node scripts/resolve-pr-context.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Resolve selected review policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          selected="${{ vars.AI_REVIEW_AGENT }}"
          selected="${selected:-codex}"
          case "$selected" in
            codex|claude|gemini) ;;
            *) echo "::error::Unsupported AI_REVIEW_AGENT value: '$selected'"; exit 1 ;;
          esac
          echo "selected_agent=$selected" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=${{ inputs.trigger_mode || 'skip' }}" >> "$GITHUB_OUTPUT"

      - name: Validate selected native review
        run: node scripts/ai-review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ steps.policy.outputs.selected_agent }}
          AI_REVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_TRIGGER_MODE: ${{ steps.policy.outputs.trigger_mode }}
